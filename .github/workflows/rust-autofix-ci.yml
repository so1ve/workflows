name: Rust autofix.ci

on:
  workflow_call:
    inputs:
      toolchain:
        required: false
        type: string
        default: nightly

      fmt-command:
        required: false
        type: string
        default: "cargo fmt"

      commit-message:
        required: false
        type: string
        default: "chore: apply automatic fixes"

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rust
        uses: so1ve/workflows/setup-rust@v1
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt

      - name: Run cargo fmt
        run: ${{ inputs.fmt-command }}

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: ${{ inputs.commit-message }}
