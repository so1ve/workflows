name: Rust Release

on:
  workflow_call:
    inputs:
      toolchain:
        required: false
        type: string
        default: stable

      command:
        required: false
        type: string
        default: release

      setup:
        description: Directory containing a setup composite action in the caller repository
        required: false
        type: string
        default: ""

    outputs:
      releases:
        description: release-plz releases JSON
        value: ${{ jobs.release.outputs.releases }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - name: Setup Rust
        uses: so1ve/workflows/setup-rust@v1
        with:
          toolchain: ${{ inputs.toolchain }}
          fetch-all: "true"

      - name: Stage project setup
        if: ${{ inputs.setup != '' }}
        shell: bash
        run: |
          mkdir -p .github/actions/__rust-release-setup
          cp -R "${{ inputs.setup }}"/. .github/actions/__rust-release-setup

      - name: Setup project
        if: ${{ inputs.setup != '' }}
        uses: ./.github/actions/__rust-release-setup

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: ${{ inputs.command }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
