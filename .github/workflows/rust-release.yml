name: Rust Release

on:
  workflow_call:
    inputs:
      toolchain:
        required: false
        type: string
        default: stable

      command:
        required: false
        type: string
        default: release

    outputs:
      releases:
        description: release-plz releases JSON
        value: ${{ jobs.release.outputs.releases }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - name: Setup Rust
        uses: so1ve/workflows/setup-rust@v1
        with:
          toolchain: ${{ inputs.toolchain }}
          fetch-all: "true"

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: ${{ inputs.command }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
